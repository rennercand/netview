# Combine with compose.local.yml. Only the API/worker/Redis and HTTPS tunnel run by default.
services:
  migrate:
    environment:
      NODE_ENV: production
  api:
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${FRONTEND_ORIGIN:?Set the exact HTTPS Vercel frontend origin}
  worker:
    environment:
      NODE_ENV: production
  web:
    profiles: [local-ui]
  tunnel:
    image: cloudflare/cloudflared:2026.2.0@sha256:404528c1cd63c3eb882c257ae524919e4376115e6fe57befca8d603656a91a4c
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "--url",
        "http://api:3000",
        "--protocol",
        "http2",
      ]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
